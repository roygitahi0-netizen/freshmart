databases:
  - name: freshmart-db
    plan: free

services:
  - type: web
    name: freshmart-api
    env: python
    buildCommand: pipenv install
    releaseCommand: flask db upgrade
    startCommand: gunicorn run:app
    healthCheckPath: /api/products
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: freshmart-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: run.py